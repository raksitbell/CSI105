<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Stack vs Queue Visualization</title>

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="../global.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {sans: ['Kanit', 'sans-serif']},
                    colors: {blue: {650: '#2563eb'}}
                }
            }
        }
    </script>
</head>
<body class="bg-blue-50/30 text-gray-900 font-sans antialiased min-h-screen relative">

<!-- NAV BAR -->
<nav class="bg-white border-b border-blue-100 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-200">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"
                              stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                    </svg>
                </div>
                <div>
                    <span class="text-xl font-bold text-gray-900 block leading-none">Stack & Queue</span>
                    <span class="text-[10px] text-blue-600 font-bold uppercase tracking-wider">Visualization Tool</span>
                </div>
            </div>
            <div class="flex items-center gap-2 sm:gap-4">
                <a class="text-sm font-semibold text-blue-600 hover:text-blue-800 transition-colors flex items-center gap-1 bg-blue-50 px-3 py-1.5 rounded-lg border border-blue-100"
                   href="deepdive.html">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" stroke-linecap="round" stroke-linejoin="round"
                              stroke-width="2"></path>
                    </svg>
                    <span class="hidden xs:inline">Deep Dive</span>
                </a>
                <a class="text-sm font-semibold text-slate-600 hover:text-blue-600 transition-colors flex items-center gap-1"
                   href="../index.html">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path d="M10 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"
                              stroke-width="2"></path>
                    </svg>
                    Back <span class="hidden xs:inline">to Workshop</span>
                </a>
            </div>
        </div>
    </div>
</nav>

<div class="max-w-7xl mx-auto space-y-6 p-4 md:p-8">

    <!-- HEADER (REMOVED) -->

    <!-- CONTROLS -->
    <div class="bg-white p-6 rounded-2xl border border-blue-100 shadow-sm flex flex-col md:flex-row gap-4 items-center justify-center sticky top-0 z-30">
        <input class="border-blue-200 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 text-sm p-2.5 w-full md:w-64" id="inputValue"
               placeholder="Enter value..."
               type="text">
        <div class="flex flex-wrap justify-center gap-2 w-full md:w-auto">
            <button class="text-white bg-blue-600 hover:bg-blue-700 font-medium rounded-lg text-sm px-5 py-2.5 shadow-sm transition-colors flex items-center justify-center gap-2"
                    onclick="addToBoth()">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                </svg>
                Add Data (Both)
            </button>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- STACK COLUMN -->
        <div class="bg-white rounded-2xl border border-blue-100 shadow-sm overflow-hidden flex flex-col h-[600px]">
            <div class="p-4 border-b border-blue-50 bg-blue-50/20 flex flex-col sm:flex-row justify-between items-center gap-3">
                <div class="flex items-start gap-3">
                    <div class="p-2 bg-white border border-blue-100 rounded-lg text-blue-600 mt-1">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" stroke-linecap="round" stroke-linejoin="round"
                                  stroke-width="2"></path>
                        </svg>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-gray-900">Stack</h2>
                        <p class="text-xs text-blue-500 font-medium uppercase tracking-wider">LIFO (Last In, First
                            Out)</p>
                    </div>
                </div>
            </div>

            <div class="p-3 bg-white border-b border-blue-50 flex flex-wrap gap-2 items-center justify-center sm:justify-start">
                <div class="flex items-center" id="stackPushControl">
                    <button class="text-xs font-medium text-gray-700 bg-white hover:bg-gray-50 border border-blue-100 rounded px-3 py-1.5 transition-colors flex items-center gap-1" id="btnPushTrigger"
                            onclick="toggleStackInput(true)">
                        Push
                    </button>
                    <div class="hidden flex items-center gap-1 animate-fade-in" id="inputPushStack">
                        <input class="w-24 text-xs border-blue-200 rounded px-2 py-1 focus:ring-blue-500 focus:border-blue-500" id="valPushStack"
                               placeholder="Value"
                               type="text">
                        <button class="text-white bg-blue-600 hover:bg-blue-700 rounded px-2 py-1 flex transition-colors"
                                onclick="submitPushStack()">
                            Confirm
                        </button>
                        <button class="text-gray-400 hover:text-red-600 rounded px-2 py-1"
                                onclick="toggleStackInput(false)">✕
                        </button>
                    </div>
                </div>
                <button class="text-xs font-medium text-gray-700 bg-white hover:bg-gray-50 border border-blue-100 rounded px-3 py-1.5 transition-colors"
                        onclick="peekStack()">
                    Top
                </button>
                <button class="text-xs font-medium text-red-600 bg-red-50 hover:bg-red-100 border border-red-100 rounded px-3 py-1.5 transition-colors"
                        onclick="popStack()">
                    Pop
                </button>
                <button class="text-xs font-medium text-red-600 bg-white hover:bg-red-50 border border-blue-100 rounded px-3 py-1.5 transition-colors"
                        onclick="clearStack()">
                    Clear
                </button>
            </div>

            <div class="p-2 bg-blue-50/10 border-b border-blue-50 text-xs text-blue-900 font-mono text-center truncate px-4 h-8"
                 id="stackLog"></div>
            <div class="p-4 flex-1 overflow-y-auto bg-white flex flex-col-reverse justify-end items-center gap-2"
                 id="stackList"></div>
        </div>

        <!-- QUEUE COLUMN -->
        <div class="bg-white rounded-2xl border border-blue-100 shadow-sm overflow-hidden flex flex-col h-[600px]">
            <div class="p-4 border-b border-blue-50 bg-blue-50/20 flex flex-col sm:flex-row justify-between items-center gap-3">
                <div class="flex items-start gap-3">
                    <div class="p-2 bg-white border border-blue-100 rounded-lg text-blue-600 mt-1">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" stroke-linecap="round" stroke-linejoin="round"
                                  stroke-width="2"></path>
                        </svg>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-gray-900">Queue</h2>
                        <p class="text-xs text-blue-500 font-medium uppercase tracking-wider">FIFO (First In, First
                            Out)</p>
                    </div>
                </div>
            </div>

            <div class="p-3 bg-white border-b border-blue-50 flex flex-wrap gap-2 items-center justify-center sm:justify-start">
                <div class="flex items-center" id="queueEnqueueControl">
                    <button class="text-xs font-medium text-gray-700 bg-white hover:bg-gray-50 border border-blue-100 rounded px-3 py-1.5 transition-colors flex items-center gap-1" id="btnEnqueueTrigger"
                            onclick="toggleQueueInput(true)">
                        Enqueue
                    </button>
                    <div class="hidden flex items-center gap-1 animate-fade-in" id="inputEnqueueQueue">
                        <input class="w-24 text-xs border-blue-200 rounded px-2 py-1 focus:ring-blue-500 focus:border-blue-500" id="valEnqueueQueue"
                               placeholder="Value"
                               type="text">
                        <button class="text-white bg-blue-600 hover:bg-blue-700 rounded px-2 py-1 flex transition-colors"
                                onclick="submitEnqueueQueue()">
                            Confirm
                        </button>
                        <button class="text-gray-400 hover:text-red-600 rounded px-2 py-1"
                                onclick="toggleQueueInput(false)">✕
                        </button>
                    </div>
                </div>
                <button class="text-xs font-medium text-gray-700 bg-white hover:bg-gray-50 border border-blue-100 rounded px-3 py-1.5 transition-colors"
                        onclick="peekQueueFront()">
                    Front
                </button>
                <button class="text-xs font-medium text-gray-700 bg-white hover:bg-gray-50 border border-blue-100 rounded px-3 py-1.5 transition-colors"
                        onclick="peekQueueRear()">
                    Rear
                </button>
                <button class="text-xs font-medium text-red-600 bg-red-50 hover:bg-red-100 border border-red-100 rounded px-3 py-1.5 transition-colors"
                        onclick="dequeueQueue()">
                    Dequeue
                </button>
                <button class="text-xs font-medium text-red-600 bg-white hover:bg-red-50 border border-blue-100 rounded px-3 py-1.5 transition-colors"
                        onclick="clearQueue()">
                    Clear
                </button>
            </div>

            <div class="p-2 bg-blue-50/10 border-b border-blue-50 text-xs text-blue-900 font-mono text-center truncate px-4 h-8"
                 id="queueLog"></div>
            <div class="p-4 flex-1 overflow-y-auto bg-white" id="queueList"></div>
        </div>
    </div>
</div>

<div id="toastContainer"></div>
<script src="script.js"></script>
</body>
</html>
