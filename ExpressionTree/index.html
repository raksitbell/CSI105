<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Expression Tree Visualization - CSI105</title>
    <link
            href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="../global.css" rel="stylesheet"/>
    <link href="style.css" rel="stylesheet"/>
</head>
<body class="bg-slate-50 font-['Kanit'] min-h-screen">
<!-- NAV BAR -->
<nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-200">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path d="M4 6h16M4 12h16m-7 6h7" stroke-linecap="round" stroke-linejoin="round"
                              stroke-width="2"></path>
                    </svg>
                </div>
                <div>
                    <span class="text-xl font-bold text-gray-900 block leading-none text-blue-600 sm:text-gray-900">Expression Tree</span>
                    <span class="text-[10px] text-blue-600 font-bold uppercase tracking-wider">Visualization Tool</span>
                </div>
            </div>
            <div class="flex items-center gap-2 sm:gap-4">
                <a class="text-sm font-semibold text-blue-600 hover:text-blue-800 transition-colors flex items-center gap-1 bg-blue-50 px-3 py-1.5 rounded-lg border border-blue-100"
                   href="deepdive.html">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" stroke-linecap="round" stroke-linejoin="round"
                              stroke-width="2"></path>
                    </svg>
                    <span class="hidden xs:inline">Deep Dive</span>
                </a>
                <a class="text-sm font-semibold text-slate-600 hover:text-blue-600 transition-colors flex items-center gap-1"
                   href="../index.html">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path d="M10 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"
                              stroke-width="2"></path>
                    </svg>
                    Back <span class="hidden xs:inline">to Workshop</span>
                </a>
            </div>
        </div>
    </div>
</nav>

<main class="max-w-7xl mx-auto px-6 py-10">
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
        <!-- Controls Panel -->
        <div class="lg:col-span-1 space-y-6">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                    <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"
                              stroke-linecap="round" stroke-linejoin="round"
                              stroke-width="2"></path>
                    </svg>
                    Controls
                </h2>

                <div class="space-y-4">
                    <div>
                        <div class="flex items-center justify-between mb-1">
                            <label class="block text-sm font-medium text-slate-600">Expression Input (Infix)</label>
                        </div>
                        <label for="expressionInput"></label><input
                            class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-sm"
                            id="expressionInput"
                            oninput="showResults()"
                            type="text"
                            value="(a + b) * (c - d) / (e + f)"
                    />
                    </div>

                    <!-- Postfix/Prefix Results -->
                    <div class="grid grid-cols-1 gap-2">
                        <div class="p-3 bg-slate-50 border border-slate-100 rounded-xl">
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Postfix</label>
                            <p class="text-xs font-bold text-slate-700 break-all" id="postfixResult">-</p>
                        </div>
                        <div class="p-3 bg-slate-50 border border-slate-100 rounded-xl">
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Prefix</label>
                            <p class="text-xs font-bold text-slate-700 break-all" id="prefixResult">-</p>
                        </div>
                    </div>

                    <div class="flex gap-2 pt-2">
                        <button
                                class="flex-1 px-4 py-3 bg-blue-600 text-white rounded-xl text-sm font-bold hover:bg-blue-700 transition-all active:scale-95 shadow-lg shadow-blue-100 flex items-center justify-center gap-2"
                                id="buildTreeBtn"
                                onclick="buildTree(true)"
                        >
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path d="M13 10V3L4 14h7v7l9-11h-7z" stroke-linecap="round" stroke-linejoin="round"
                                      stroke-width="2"></path>
                            </svg>
                            Build Tree
                        </button>
                        <button
                                class="flex-1 px-4 py-3 bg-slate-100 text-slate-700 rounded-xl text-sm font-bold hover:bg-slate-200 transition-all active:scale-95 flex items-center justify-center gap-2"
                                id="skipBtn"
                                onclick="skipToFinal()"
                        >
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path d="M13 5l7 7-7 7M5 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"
                                      stroke-width="2"></path>
                            </svg>
                            Skip
                        </button>
                    </div>
                </div>
            </div>

            <!-- Playback Controls -->
            <div class="space-y-4">
                <div class="flex items-center justify-between gap-2">
                    <button
                            class="flex-1 px-4 py-2 bg-blue-50 border border-blue-200 rounded-lg text-sm font-bold text-blue-600 hover:bg-blue-100 transition-all flex items-center justify-center gap-2"
                            id="playBtn"
                            onclick="togglePlay()"
                    >
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z"></path>
                        </svg>
                        Play
                    </button>
                    <button
                            class="flex-1 px-4 py-2 bg-white border border-slate-200 rounded-lg text-sm font-bold text-slate-600 hover:bg-slate-50 transition-all disabled:opacity-50 disabled:cursor-not-allowed"
                            id="stepBtn"
                            onclick="nextStep()"
                    >
                        Step
                    </button>
                </div>
            </div>
        </div>

        <!-- Visualization Canvas -->
        <div class="lg:col-span-3 space-y-6">
            <div class="bg-white rounded-3xl p-8 shadow-sm border border-slate-200 min-h-[600px] flex flex-col relative overflow-hidden">
                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-8 gap-4">
                    <div>
                        <h2 class="text-2xl font-bold text-slate-800">Visualizer</h2>
                        <p class="text-slate-500 text-sm">Step-by-step Expression Tree construction</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button class="p-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-600 transition-all active:scale-95"
                                onclick="zoomIn()" title="Zoom In">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"
                                      stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                            </svg>
                        </button>
                        <button class="p-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-600 transition-all active:scale-95"
                                onclick="zoomOut()" title="Zoom Out">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM7 10h6" stroke-linecap="round"
                                      stroke-linejoin="round" stroke-width="2"></path>
                            </svg>
                        </button>
                        <button class="p-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-600 transition-all active:scale-95"
                                onclick="centerTree()" title="Center Tree">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round"
                                      stroke-linejoin="round"
                                      stroke-width="2"></path>
                                <path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                                      stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="flex flex-wrap items-center gap-4 text-xs font-bold uppercase tracking-widest">
                        <div class="flex items-center gap-1.5">
                            <span class="w-3 h-3 bg-blue-500 rounded-full"></span>
                            <span class="text-slate-400">Operand</span>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <span class="w-3 h-3 bg-emerald-500 rounded-full"></span>
                            <span class="text-slate-400">Operator</span>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <span class="w-3 h-3 bg-amber-500 rounded-full"></span>
                            <span class="text-slate-400">Processing</span>
                        </div>
                    </div>
                </div>

                <!-- Tree Container -->
                <div class="flex-1 overflow-auto border border-slate-100 rounded-2xl p-4 bg-slate-50/50"
                     id="treeContainer">
                    <div class="min-w-max min-h-max flex items-center justify-center" id="treeSvgWrapper">
                        <!-- SVG will be rendered here -->
                    </div>
                </div>

            </div>

            <!-- Step History -->
            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200">
                <h3 class="text-sm font-bold text-slate-800 mb-4 uppercase tracking-widest">Step</h3>
                <div class="max-h-48 overflow-y-auto space-y-1.5 pr-2 custom-scrollbar" id="historyLog">
                    <div class="text-center py-8 text-slate-400 italic text-xs">No history yet.</div>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="script.js"></script>
</body>
</html>
